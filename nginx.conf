worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  # Load-balanced upstream pool (least_conn routes traffic to the least busy backend instance)
  upstream ideabridge_cluster {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    # Add additional backend nodes or container instances below for horizontal scaling:
    # server 10.0.1.11:3000 max_fails=3 fail_timeout=15s;
    # server 10.0.1.12:3000 max_fails=3 fail_timeout=15s;
    keepalive 64;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Load-balancer health check endpoint (no caching)
    location = /healthz {
      proxy_pass http://ideabridge_cluster/healthz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "no-store";
    }

    # Dynamic API routes distributed across healthy upstream workers
    location /api/ {
      proxy_pass http://ideabridge_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
    }

    # Long-term immutable cache for hashed frontend build assets
    location /assets/ {
      proxy_pass http://ideabridge_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback & HTML shell
    location / {
      proxy_pass http://ideabridge_cluster;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
